# The FabCopilot screen on Netlify. The API runs separately (see render.yaml), because
# Netlify can't run a Python server. Set VITE_API_URL in Netlify's site settings
# (Site configuration -> Environment variables) to the API's address, for example
#   https://fabcopilot-api.onrender.com
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
