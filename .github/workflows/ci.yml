name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fab
          POSTGRES_PASSWORD: fab
          POSTGRES_DB: fabtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fab -d fabtest" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://fab:fab@localhost:5432/fabtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack from a clean machine
        run: docker compose up --build --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS localhost:8080/api/status | tee status.json
          grep -q '"lots":40' status.json
          curl -fsSN -X POST localhost:8080/api/chat -H 'Content-Type: application/json' \
            -d '{"message":"Why did yield drop?"}' | tee chat.txt | grep -q 'ETCH-03-B is the common cause'
      - if: failure()
        run: docker compose logs
