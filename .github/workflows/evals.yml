name: Evals

# Runs the golden questions against a real model. Manual only, because it costs API credits.
# Needs a repository secret OPENAI_API_KEY or GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "auto | openai | gemini | demo"
        default: auto

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m evals.run_evals --provider "${{ inputs.provider }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/
