# The FabCopilot API on Render (free plan), built from backend/Dockerfile.
# In Render: New -> Blueprint -> pick this repository and branch -> enter GEMINI_API_KEY.
services:
  - type: web
    name: fabcopilot-api
    runtime: docker
    plan: free
    branch: claude/github-repo-setup-tiskb2
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # you type it in Render; it is never in the repository
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDER
        value: hashing         # offline search: no embedding quota used at start-up
      - key: DATABASE_URL
        value: sqlite:////tmp/fabcopilot.db   # rebuilt from seed on every start
      - key: CORS_ORIGINS
        value: "*"             # tighten to your Netlify address once you know it
      - key: CHAT_LIMIT_PER_HOUR
        value: "5"             # per visitor, protects your model quota
